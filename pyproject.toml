[project]
name = "file2doc"
version = "0.1.23"
description = "HTTP-first offline file parsing service for agent-friendly result packages."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "imageio-ffmpeg>=0.5",
  "markitdown[pdf,pptx,docx,xlsx]>=0.1.2",
  "markitdown-ocr>=0.1.0",
  "openai>=1.0",
  "pillow>=10",
  "pypdfium2>=4.30",
  "python-multipart>=0.0.9",
  "funasr>=1.2",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/file2doc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
